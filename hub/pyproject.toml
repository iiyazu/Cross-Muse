[project]
name = "xmuse"
version = "0.1.0"
description = "xmuse 2 hub: local message layer and wake engine for coding agents"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "zstandard>=0.25.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyjwt>=2.8",
    "tree-sitter>=0.23",
    "tree-sitter-bash>=0.23",
]

[project.scripts]
xmuse = "xmuse.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xmuse"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
